spring.application.name=my-retro-app
spring.banner.location=classpath:/META-INF/banner.txt
server.port=8081

# MongoDB
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.database=retrodb
spring.data.mongodb.repositories.type=reactive
spring.docker.compose.file=./myretro/docker-compose.yaml
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27020

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Logging correlation pattern
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Actuator Info
info.developer.name=Temirlan
info.developer.email=temirlan@email.com
info.api.version=1.0
management.endpoint.env.enabled=true

# Actuator ? expose endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Actuator Observations
management.observations.key-values.application=${spring.application.name}

# Actuator Metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Actuator Tracing
management.tracing.sampling.probability=1.0

# Actuator Prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.use-global-registry=true

# Users App Service (java-component)
users.app.url=http://localhost:8083
users.app.username=admin
users.app.password=admin

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

