spring.banner.location=classpath:/META-INF/banner.txt

#spring.data.mongodb.uuid-representation=standard

#spring.data.redis.host=localhost
#spring.data.redis.port=6379

# App
spring.application.name=my-retro
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.database=retrodb
spring.data.mongodb.repositories.type=reactive
spring.docker.compose.file=./myretro/docker-compose.yaml

# Authorization Server JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Client Registration
spring.security.oauth2.client.registration.myretro-client-authorization-code.provider=spring
spring.security.oauth2.client.registration.myretro-client-authorization-code.client-id=myretro-client
spring.security.oauth2.client.registration.myretro-client-authorization-code.client-secret=secret
spring.security.oauth2.client.registration.myretro-client-authorization-code.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.myretro-client-authorization-code.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.myretro-client-authorization-code.scope=openid,profile,retros:read,retros:write
spring.security.oauth2.client.registration.myretro-client-authorization-code.client-name=myretro-client-authorization-code

# Provider
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:9000

# Logging
logging.level.org.springframework.security=TRACE
